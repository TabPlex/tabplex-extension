name: "Package Extension"
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TABPLEX_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          run_install: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release candidate
        run: |
          pnpm format:check
          pnpm scan:secrets
          pnpm licenses:check
          pnpm audit:prod
          pnpm typecheck
          pnpm typecheck:unused
          pnpm typecheck:strictnull:core
          pnpm test
      - name: Build Chrome extension
        run: pnpm build:chrome
      - name: Build Edge extension
        run: pnpm build:edge
      - name: Smoke production extension pages
        run: >-
          pnpm smoke:extension-pages --
          build/chrome-mv3-prod
          build/edge-mv3-prod
      - name: Package Chrome extension
        run: pnpm package:chrome
      - name: Package Edge extension
        run: pnpm package:edge
      - name: Verify final release artifacts
        run: pnpm verify:release-artifacts
      - name: Rename package zips
        run: |
          mv build/chrome-mv3-prod.zip build/tabplex-chrome-${{ github.ref_name }}.zip
          mv build/edge-mv3-prod.zip build/tabplex-edge-${{ github.ref_name }}.zip
      - name: Upload browser package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabplex-${{ github.ref_name }}
          path: |
            build/tabplex-chrome-${{ github.ref_name }}.zip
            build/tabplex-edge-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 14
