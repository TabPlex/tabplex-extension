name: "Submit to Web Store"
on:
  workflow_dispatch:
    inputs:
      confirm_brand_and_legal_clearance:
        description: "已完成正式品牌、Plex 商标和法律发布审查"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.confirm_brand_and_legal_clearance }}
    runs-on: ubuntu-latest
    environment: chrome-web-store-production
    env:
      TABPLEX_RELEASE_DESCRIPTION: "TabPlex 是本地优先、可恢复的任务上下文工作区，可安全切换多窗口标签，并保留笔记与链接。"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.2
          run_install: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release candidate
        run: |
          pnpm scan:secrets
          pnpm audit --audit-level high
          pnpm typecheck
          pnpm typecheck:unused
          pnpm typecheck:strictnull:core
          pnpm test
      - name: Build the extension
        run: pnpm build:chrome
      - name: Package the extension into a zip artifact
        run: pnpm package:chrome
      - name: Verify final release artifact
        run: pnpm verify:release-artifacts -- build/chrome-mv3-prod
      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@c15984c0a74f452851c605cab46f34d9fd6cb158 # v3.8.0
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
