name: Bug report
description: Report a reproducible TabPlex problem without private browsing data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post vulnerabilities, exported backups, private URLs, credentials, or Agent pairing codes here. Follow SECURITY.md for private reports.
  - type: input
    id: version
    attributes:
      label: TabPlex version
      placeholder: "0.0.3"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Other Chromium browser
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with synthetic data
      description: Replace real workspace names and URLs with safe examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
